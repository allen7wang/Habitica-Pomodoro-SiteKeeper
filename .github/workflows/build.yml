name: build

# 三端构建验证 + 未签名产物。正式发布（含签名与 release notes）仍在本地进行：
# - macOS DMG 为 ad-hoc 签名（build.sh 内置），可直接分发
# - iOS 产物为未签名 IPA，安装需用自己的 Apple ID 重签（见 release 说明）
# - Android 为 debug 签名 APK，可直接侧载
on:
  push:
    branches: ['master']
    tags: ['v*']
  pull_request:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Apple build prerequisites
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Run Apple offline regressions
        env:
          TMPDIR: ${{ runner.temp }}/apple-fixtures-tmp
        run: |
          mkdir -p "$TMPDIR"
          python3 HabiticaPomodoro/fixtures/run.py --work "$TMPDIR"

      - name: Build macOS app + DMG (universal, ad-hoc signed)
        env:
          HABITICA_BUILD_TEMP: ${{ runner.temp }}
          HABITICA_BUILD_OUTPUT: ${{ runner.temp }}/mac-app
        run: bash HabiticaPomodoro/build.sh

      - name: Build iOS device app (unsigned) + IPA
        run: |
          cd HabiticaPomodoro
          xcodegen generate
          xcodebuild -project HabiticaPomodoroMobile.xcodeproj \
            -scheme HabiticaPomodoroMobile \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" -jobs 2 -configuration Release \
            build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM=''
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/ios-dd/Build/Products/Release-iphoneos/HabiticaPomodoro.app" \
                "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qr "$RUNNER_TEMP/HabiticaPomodoro-iOS-unsigned.ipa" Payload

      - name: Build iOS Simulator app (compile check)
        run: |
          cd HabiticaPomodoro
          xcodebuild -project HabiticaPomodoroMobile.xcodeproj \
            -scheme HabiticaPomodoroMobile \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/sim-dd" -jobs 2 -configuration Debug \
            build CODE_SIGNING_ALLOWED=NO

      - name: Collect artifacts + checksums
        run: |
          mkdir -p dist
          cd "$RUNNER_TEMP/mac-app"
          ditto -c -k --keepParent HabiticaPomodoro.app "$GITHUB_WORKSPACE/dist/HabiticaPomodoro-macOS-universal.app.zip"
          cp "$GITHUB_WORKSPACE/HabiticaPomodoro/HabiticaPomodoro-Installer.dmg" \
             "$GITHUB_WORKSPACE/dist/HabiticaPomodoro-Installer.dmg"
          cp "$RUNNER_TEMP/HabiticaPomodoro-iOS-unsigned.ipa" \
             "$GITHUB_WORKSPACE/dist/HabiticaPomodoro-iOS-unsigned.ipa"
          cd "$GITHUB_WORKSPACE/dist"
          shasum -a 256 HabiticaPomodoro-macOS-universal.app.zip \
            HabiticaPomodoro-Installer.dmg HabiticaPomodoro-iOS-unsigned.ipa > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: apple-artifacts
          path: dist/
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          # Override v3's legacy "tools platform-tools" default.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Run Android offline regressions
        env:
          POMO_FIXTURES_WORK: ${{ runner.temp }}/android-fixtures
          POMO_FIXTURES_TOOLCHAIN: ${{ runner.temp }}/android-fixtures-toolchain
          TMPDIR: ${{ runner.temp }}/android-fixtures-tmp
        run: |
          mkdir -p "$TMPDIR"
          python3 HabiticaPomodoroAndroid/fixtures/run.py

      - name: Build debug APK
        run: |
          cd HabiticaPomodoroAndroid
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain

      - name: Collect artifacts + checksums
        run: |
          mkdir -p dist
          cp HabiticaPomodoroAndroid/app/build/outputs/apk/debug/app-debug.apk \
             dist/HabiticaPomodoro-Android-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/HabiticaPomodoro-Android-debug.apk | grep '^package'
          cd dist
          sha256sum HabiticaPomodoro-Android-debug.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: dist/
          if-no-files-found: error
