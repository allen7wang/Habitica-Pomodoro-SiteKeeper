</style></head><body data-variant="garden">
<div class="lab"><header class="labhead"><div><div class="kicker">HABITICA POMODORO / DESIGN STUDY 01</div><h1 class="labtitle">把专注，做得轻一点。</h1></div><p class="lab-meta">三个可交互的视觉方向。以下全部为示例数据，<br>不连接你的账户，不改变计时或同步数据。</p></header>
<div class="variantbar" role="group" aria-label="选择设计方向"><button class="variant" data-variant-choice="mint"><strong>01 清新原生<span class="recommended">推荐</span></strong><small>紧凑、有序、日常好用</small></button><button class="variant" data-variant-choice="garden"><strong>02 留白花园</strong><small>安静、舒展、专注优先</small></button><button class="variant" data-variant-choice="studio"><strong>03 效率工作台</strong><small>并排规划、信息一眼可见</small></button></div>
<div class="stage"><article class="app-window" id="app" aria-label="番茄钟视觉原型"><div class="windowbar"><span class="traffic" aria-hidden="true"></span><span class="traffic" aria-hidden="true"></span><span class="traffic" aria-hidden="true"></span><span class="windowtitle">Habitica Pomodoro</span><div class="window-tools"><button class="icon-button" data-action="theme" title="切换深浅色" aria-label="切换深浅色"></button><button class="icon-button" data-action="settings" title="设置" aria-label="打开设置"></button></div></div><div class="app-layout"><nav class="appnav" id="nav" aria-label="主导航"></nav><main class="screen" id="screen"></main></div><footer class="status-footer"><span id="connection-status"></span><span>设计预览 · 示例数据</span></footer></article><aside class="design-note" id="design-note"></aside></div><p class="preview-disclaimer">可试：开始 / 暂停、切换页面、完成或添加示例任务、声音设置、深浅色。预览不播放声音，不发出通知。</p></div>
<dialog class="dialog" id="dialog" aria-labelledby="dialog-title"></dialog><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const paths={leaf:'<path d="M19 4c-6-1-12 2-12 8 0 3 2 5 5 5 6 0 8-7 7-13Z"/><path d="M5 21c0-7 5-11 10-13"/>',timer:'<circle cx="12" cy="13" r="8"/><path d="M9 2h6M12 5V2m0 11 3-3"/>',task:'<rect x="5" y="4" width="15" height="17" rx="3"/><path d="M9 4V2m7 2V2M8 11l2 2 4-4m-6 8h8"/>',habit:'<path d="m12 3 2.7 5.5L21 9.4 16.5 14l1.1 6.5L12 17.4l-5.6 3.1L7.5 14 3 9.4l6.3-.9Z"/>',daily:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-13 5 3 3 5-5"/>',role:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',settings:'<path d="m9 3-.5 3-2.7 1.5-2.8-1.1-2 3.4 2.3 1.9v3L1 16.6 3 20l2.8-1.1L8.5 20 9 23h4l.5-3 2.7-1.5L19 19.6l2-3.4-2.3-1.9v-3L21 9.4 19 6l-2.8 1.1L13.5 6 13 3Z" transform="translate(1 -1) scale(.91)"/><circle cx="12" cy="11.8" r="3"/>',moon:'<path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>',play:'<path d="m8 4 12 8-12 8Z"/>',pause:'<path d="M8 4v16m8-16v16"/>',reset:'<path d="M3 10a9 9 0 1 1 1.5 8M3 3v7h7"/>',sound:'<path d="M4 10v4m4-8v12m4-15v18m4-15v12m4-8v4"/>',chevron:'<path d="m9 5 7 7-7 7"/>',plus:'<path d="M12 5v14M5 12h14"/>',cloud:'<path d="M7 18a5 5 0 1 1 1-9.9 7 7 0 0 1 13 3.9 3 3 0 0 1-1 6Z"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',check:'<path d="m5 12 4 4L19 6"/>'};
const icon=(name)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.leaf}</svg>`;
const escapeHTML=(value)=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const design={mint:{name:'清新原生',intro:'熟悉的效率工具，\n更轻盈的一面。',copy:'保留紧凑 Tab，把开始专注、时间块和声音分成清晰层级。更像一款每天愿意打开的原生应用。',detail:['紧凑五 Tab · 深绿主操作','扁平模块 · 细边界与留白','适合 Mac / iPhone / Android'],colors:['#fbfcf9','#e4eee1','#2d7055','#263a31']},garden:{name:'留白花园',intro:'少一点信息，\n多一点专注。',copy:'主操作居中，植物进度轻轻出现；导航移到下方。视觉更安静，也让同时查看任务的操作多了一步。',detail:['低密度单列 · 轻量成长反馈','下方导航 · 更有呼吸感','适合专注优先、偏移动端'],colors:['#f9f9f1','#e8edd9','#576f48','#38432f']},studio:{name:'效率工作台',intro:'让专注与计划，\n并排发生。',copy:'左侧固定导航，专注与今日任务并排。更适合桌面重度用户；窗口会比现在更宽。',detail:['双栏布局 · 任务一眼可见','侧栏导航 · 更高信息密度','窄屏自动单列，桌面优先'],colors:['#fcfdfa','#e4eee7','#286c61','#263b35']}};
const state={variant:'garden',page:'focus',started:false,running:false,remaining:25*60,finished:2,connected:false,source:'qishi',volume:40,tasks:[{id:1,text:'完成产品方案的第一稿',category:0,done:false},{id:2,text:'整理今天的工作重点',category:0,done:true},{id:3,text:'读完手边那本书的一章',category:1,done:false},{id:4,text:'出门走一走',category:2,done:false}],nextId:5,habits:[0,0,0],dailies:[false,true,false],dark:false};
const pages=[['focus','timer','专注'],['tasks','task','任务'],['habits','habit','习惯'],['dailies','daily','每日'],['role','role','角色']];
let interval=null,toastTimer=null,taskCategory=0;
const $=s=>document.querySelector(s);
function time(){return `${Math.floor(state.remaining/60).toString().padStart(2,'0')}:${(state.remaining%60).toString().padStart(2,'0')}`;}
function pageHeader(label,title,detail=''){return `<div class="task-header"><div class="page-topline"><span class="eyebrow">${label}</span><span class="date-label">示例数据</span></div><h1>${title}</h1>${detail?`<p>${detail}</p>`:''}</div>`;}
function plantRail(){return `<div class="plant-rail" aria-label="示例时间块：两棵灌木，四个空位，额外组合树"><div class="plant-position">${icon('leaf')}<span>1</span></div><div class="plant-position">${icon('leaf')}<span>2</span></div>${[3,4,5,6].map(n=>`<div class="plant-position empty"><span class="plant-mark"></span><span>${n}</span></div>`).join('')}<div class="plant-position tree"><svg viewBox="0 0 24 24" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 6 7h-3l5 6h-6v6h-4v-6H4l5-6H6Z"/></svg><span>组合</span></div></div>`;}
function taskRow(task,tag=false){return `<div class="task-row ${task.done?'complete':''}" data-task-row="${task.id}"><label class="task-target"><input class="task-check" type="checkbox" ${task.done?'checked':''} data-task="${task.id}" aria-label="${task.done?'取消完成':'完成'} ${escapeHTML(task.text)}"></label><span class="task-title">${escapeHTML(task.text)}</span>${tag?'<span class="task-tag">工作</span>':''}</div>`;}
function renderFocus(){const garden=state.variant==='garden';return `<div class="screen-header"><div><span class="eyebrow">${garden?'专注，自然生长':'YOUR DAILY FOCUS'}</span><h1>${garden?'留一刻，给自己。':'专注好这一刻。'}</h1></div><span class="date-label">${icon('daily')}今天</span></div><div class="focus-grid"><section class="focus-pane" aria-label="计时与专注控制"><div class="phase-picker"><span class="phase-current"><i class="small-dot"></i>专注</span><span>短休息</span><span>长休息</span></div><div class="timer"><svg viewBox="0 0 240 240" aria-hidden="true"><circle class="track" cx="120" cy="120" r="108"/><circle class="progress" id="progress" cx="120" cy="120" r="108"/><circle class="endcap" cx="228" cy="120" r="3.2"/></svg><div class="timer-text"><div class="clock" id="clock" role="timer" aria-label="剩余时间">${time()}</div><div class="timer-caption" id="timer-caption">准备开始第 3 次专注</div></div></div><div class="focus-controls"><button class="primary" data-action="start" id="start-button">${icon('play')}<span>开始专注</span><span class="shortcut">⌘⇧P</span></button><button class="secondary" data-action="reset" title="结束并重置示例计时" aria-label="结束并重置示例计时">${icon('reset')}</button></div><div class="stats-line"><span><strong>${state.finished}</strong>次已完成</span><span class="vdivider"></span><span><strong>${state.finished*25}</strong>分钟专注</span></div><p class="garden-message">每一次认真，都在慢慢生长。<br>今天已完成 ${state.finished} 次专注。</p></section><section class="context-pane" aria-label="当前时间块与声音"><div class="block-summary"><div class="section-head"><h2>当前时间块</h2><button class="section-link" data-action="blocks">查看全部 ${icon('chevron')}</button></div><div class="block-line"><div class="block-name">B3</div><div class="block-copy"><strong>把重要的事，先做好</strong><p>10:00 – 13:00 · 示例时间块</p></div><span class="block-count">2 / 6</span></div>${plantRail()}</div><div class="task-preview"><div class="section-head"><h2>今日要事</h2><button class="section-link" data-page="tasks">全部任务</button></div>${state.tasks.filter(t=>t.category===0).map(t=>taskRow(t)).join('')}<button class="task-add" data-add="0">${icon('plus')}添加一件重要的事</button></div><button class="sound-row" data-action="sound"><span class="sound-art">${icon('sound')}</span><span class="sound-text"><strong id="sound-title">${state.source==='qishi'?'栖时 · 落叶听雨':'自定义 · 雨声'}</strong><p>跟随专注 · 预览不播放声音</p></span>${icon('chevron')}</button></section></div>`;}
function renderTasks(){const cats=['工作 · Work','自我 · MyOwn','生活 · Chores'];return pageHeader('TODAY / TASKS','把今天，安排得刚刚好。','工作与自我各最多三件事，生活琐事自由添加。')+cats.map((cat,n)=>{const list=state.tasks.filter(t=>t.category===n);return `<section class="task-group"><div class="group-heading"><span>${cat}</span><span class="quota">${list.filter(t=>t.done).length} 已完成${n<2?` · ${list.length} / 3`:` · 共 ${list.length} 件`}</span></div>${list.map(t=>taskRow(t)).join('')}${n<2&&list.length>=3?'<p class="empty-hint">该分类已有 3 件示例任务，可切换分类继续体验。</p>':`<button class="task-add" data-add="${n}">${icon('plus')}添加一件事</button>`}</section>`;}).join('')+`<div class="archive-row"><span>昨天 · 只读归档</span><button class="section-link" data-action="archive">查看昨日</button></div>`;}
function renderHabits(){return pageHeader('LITTLE BY LITTLE','习惯，从一次开始。','为自己的小小坚持，留下一笔。以下为交互示例。')+['深度阅读','规律运动','少一点无目的浏览'].map((name,n)=>`<div class="habit-row"><span class="sound-art">${icon(n===0?'task':n===1?'leaf':'timer')}</span><div class="habit-copy"><strong>${name}</strong><p>${n===2?'减少让自己分心的时刻':'每一点进步都值得记录'}</p></div><button class="score-button" data-score="${n}" data-direction="-1" aria-label="${name} 减分">−</button><span class="habit-sign">${state.habits[n]}</span><button class="score-button" data-score="${n}" data-direction="1" aria-label="${name} 加分">＋</button></div>`).join('')+`<p class="empty-hint">这里保留 Habitica 的 + / − 打分方式。<br>设计预览只更新本页数字，不发送真实打分。</p>`;}
function renderDailies(){return pageHeader('DAILY ROUTINE','把日常，变成节奏。','今天的小清单，做完一件就轻一点。')+`<div class="day-strip" aria-label="示例一周"><span>一</span><span>二</span><span>三</span><span>四</span><span class="today">五</span><span>六</span><span>日</span></div>`+['整理工作空间','喝一杯水','睡前收好明天的计划'].map((text,n)=>`<div class="task-row ${state.dailies[n]?'complete':''}"><label class="task-target"><input class="task-check" type="checkbox" data-daily="${n}" ${state.dailies[n]?'checked':''} aria-label="${escapeHTML(text)}"></label><span class="task-title">${text}</span><span class="task-tag">每日</span></div>`).join('')+`<p class="empty-hint">示例：已完成 ${state.dailies.filter(Boolean).length} / ${state.dailies.length} 件。<br>真实版本沿用现有每日任务与同步规则。</p>`;}
function renderRole(){return pageHeader('YOUR CHARACTER','每次专注，都算数。')+`<div class="role-banner"><div class="avatar">${icon('leaf')}</div><div><strong>示例角色</strong><p>Level 12 · 旅程刚刚好</p></div></div>${[['生命 HP',32,50],['魔法 MP',24,45],['经验 EXP',180,250]].map(([label,n,total])=>`<div class="role-meter"><div class="meter-label"><span>${label}</span><span>${n} / ${total}</span></div><div class="meter-track"><div class="meter-fill" style="width:${n/total*100}%"></div></div></div>`).join('')}<div class="role-summary"><div><small>示例金币</small><strong>128.5 <small style="display:inline">GP</small></strong></div><div><small>今日专注</small><strong>${state.finished*25} <small style="display:inline">分钟</small></strong></div></div><p class="empty-hint">保留角色成长，但不让数值打扰专注。<br>所有角色数值仅为视觉示例。</p>`;}
function updateClock(){const clock=$('#clock');if(!clock)return;clock.textContent=time();const length=2*Math.PI*108;const circle=$('#progress');circle.style.strokeDasharray=`${length}`;circle.style.strokeDashoffset=`${length*(state.remaining/(25*60))}`;const button=$('#start-button');button.innerHTML=icon(state.running?'pause':'play')+`<span>${state.running?'暂停专注':state.started?'继续专注':'开始专注'}</span><span class="shortcut">⌘⇧P</span>`;$('#timer-caption').textContent=state.running?'专注中 · 让时间慢慢发生':state.started?'已暂停 · 随时继续':'准备开始第 3 次专注';}
function render(){document.body.dataset.variant=state.variant;document.body.classList.toggle('dark',state.dark);$('#app').dataset.variant=state.variant;document.querySelectorAll('[data-variant-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.variantChoice===state.variant)));document.querySelector('[data-action=theme]').innerHTML=icon(state.dark?'sun':'moon');document.querySelector('[data-action=settings]').innerHTML=icon('settings');$('#nav').innerHTML=pages.map(([id,symbol,label])=>`<button class="navitem ${state.page===id?'active':''}" data-page="${id}" aria-current="${state.page===id?'page':'false'}">${icon(symbol)}<span>${label}</span></button>`).join('');$('#screen').innerHTML=({focus:renderFocus,tasks:renderTasks,habits:renderHabits,dailies:renderDailies,role:renderRole}[state.page])();$('#connection-status').innerHTML=icon('cloud')+'本地模式 · Habitica 可选连接';const d=design[state.variant];$('#design-note').innerHTML=`<span class="kicker">DESIGN DIRECTION</span><h2>${d.intro.replace('\n','<br>')}</h2><p>${d.copy}</p><div class="swatches" aria-label="设计配色">${d.colors.map(c=>`<span class="swatch" style="background:${c}"></span>`).join('')}</div><div class="note-detail">${d.detail.map(s=>`<span>${s}</span>`).join('')}</div><button class="choose-button" data-action="choose">我更喜欢「${d.name}」</button><p>这是方向选择，不是已安装的应用。选定后再落到原生界面。</p>`;updateClock();}
function toast(message){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').classList.add('visible');toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),2600);}
function modal(title,body,actions=''){const d=$('#dialog');d.innerHTML=`<div class="dialog-header"><h2 id="dialog-title">${title}</h2><button class="icon-button" data-action="close" aria-label="关闭对话框">${icon('close')}</button></div>${body}${actions?`<div class="dialog-actions">${actions}</div>`:''}`;d.showModal();}
function openSettings(sound=false){modal(sound?'声音与氛围':'轻一点的设置',`<p>原型设置，仅改变此预览，不保存到应用。随机场景、自定义声音与试听隔离在正式版本中保留。</p><label class="field"><span>背景声音</span><select id="source-choice"><option value="qishi" ${state.source==='qishi'?'selected':''}>栖时随机场景</option><option value="custom" ${state.source==='custom'?'selected':''}>自定义声音</option></select></label><label class="field"><span>音量 <span id="volume-value">${state.volume}%</span></span><input id="volume" type="range" min="0" max="100" value="${state.volume}" aria-label="示例背景音量"></label><label class="field"><span>深色外观</span><input id="dark-choice" type="checkbox" ${state.dark?'checked':''}></label><div class="field"><span>账号与文件</span><span style="font-size:10px;color:var(--muted)">未接入真实数据</span></div><p>不强迫登录，也可以开始专注。iCloud 与 Habitica 在真实应用中分别配置。</p>`,`<button class="primary" data-action="close">完成</button>`);}
function toggleTimer(){state.started=true;state.running=!state.running;if(state.running){clearInterval(interval);interval=setInterval(()=>{if(!state.running)return;if(state.remaining>0)state.remaining--;if(state.remaining===0){state.finished++;state.running=false;state.started=false;state.remaining=25*60;clearInterval(interval);render();toast('示例专注已完成，未写入真实记录。');return;}updateClock();},1000);}else{clearInterval(interval);}updateClock();}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.variantChoice){state.variant=b.dataset.variantChoice;state.page='focus';render();return;}if(b.dataset.page){state.page=b.dataset.page;render();return;}if(b.dataset.add!==undefined){taskCategory=Number(b.dataset.add);modal('添加一件事','<p>只添加到设计预览。按 Enter 确认，不写入真实任务。</p><form id="task-form"><input class="text-input" id="task-input" placeholder="你想先完成什么？" maxlength="120" required aria-label="示例任务标题"><div class="dialog-actions"><button type="button" class="secondary" data-action="close">取消</button><button type="submit" class="primary">添加任务</button></div></form>');setTimeout(()=>$('#task-input')?.focus(),0);return;}if(b.dataset.score!==undefined){state.habits[Number(b.dataset.score)]+=Number(b.dataset.direction);render();toast('只更新示例分数，未发送 Habitica 请求。');return;}switch(b.dataset.action){case 'theme':state.dark=!state.dark;render();break;case 'settings':openSettings();break;case 'sound':openSettings(true);break;case 'close':$('#dialog').close();break;case 'start':toggleTimer();break;case 'reset':modal('结束这次示例专注？','<p>预览会回到 25:00。真实版本继续保留放弃确认、植物与完成计数的原有规则。</p>',`<button class="secondary" data-action="close">继续专注</button><button class="primary danger" data-action="reset-confirm">结束并重置</button>`);break;case 'reset-confirm':clearInterval(interval);state.running=false;state.started=false;state.remaining=25*60;$('#dialog').close();render();break;case 'blocks':modal('今天的时间块',`<p>此处只演示收纳后的入口，所有时间块仍然可以访问。</p>${['B1 · 早间准备','B2 · 深度工作','B3 · 当前专注','B4 · 下午计划','B5 · 学习阅读','B6 · 日常安排','B7 · 晚间整理','B8 · 留白休息'].map((s,n)=>`<div class="field"><span>${s}</span><span style="font-size:10px;color:var(--muted)">${n===2?'2 / 6 · 当前':'示例'}</span></div>`).join('')}`,`<button class="primary" data-action="close">完成</button>`);break;case 'archive':modal('昨天，已经收好。','<p>昨天的任务保留只读归档。未完成事项的顺延入口在正式界面中保留，不更改你的任务日界。</p>',`<button class="primary" data-action="close">知道了</button>`);break;case 'choose':window.__chosenVariant=state.variant;toast(`已选「${design[state.variant].name}」。在聊天中告诉我这个方向即可。`);break;}});
document.addEventListener('change',event=>{const e=event.target;if(e.dataset.task!==undefined){const task=state.tasks.find(t=>t.id===Number(e.dataset.task));if(task)task.done=e.checked;render();}else if(e.dataset.daily!==undefined){state.dailies[Number(e.dataset.daily)]=e.checked;render();}else if(e.id==='source-choice'){state.source=e.value;render();}else if(e.id==='dark-choice'){state.dark=e.checked;render();}});
document.addEventListener('input',event=>{if(event.target.id==='volume'){state.volume=Number(event.target.value);$('#volume-value').textContent=state.volume+'%';}});
document.addEventListener('submit',event=>{if(event.target.id!=='task-form')return;event.preventDefault();const text=$('#task-input').value.trim();if(!text)return;if(taskCategory<2&&state.tasks.filter(t=>t.category===taskCategory).length>=3){toast('该分类已满三件事。');return;}state.tasks.push({id:state.nextId++,text,category:taskCategory,done:false});$('#dialog').close();render();toast('示例任务已添加，不会同步到你的账户。');});
document.addEventListener('keydown',event=>{if(event.target.matches('input,select,textarea')||$('#dialog').open)return;if(event.code==='Space'&&state.page==='focus'){event.preventDefault();toggleTimer();}if((event.metaKey||event.ctrlKey)&&!event.shiftKey&&['1','2','3','4','5'].includes(event.key)){event.preventDefault();state.page=pages[Number(event.key)-1][0];render();}});
window.__designPreview={getState:()=>JSON.parse(JSON.stringify(state)),setVariant:v=>{if(design[v]){state.variant=v;state.page='focus';render();}}};
document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.shiftKey&&event.key.toLowerCase()==='p'&&!event.target.matches('input,select,textarea')&&!$('#dialog').open){event.preventDefault();toggleTimer();}});
render();
</script></body></html>
